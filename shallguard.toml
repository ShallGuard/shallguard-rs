schema = 1
minimum_requirements = 75
baseline = ".shallguard/baseline.toml"
verify_outlier_threshold = 6
allow_missing_paths = []

[[documents]]
path = "docs/USER_STORIES_AND_REQUIREMENTS.md"
source_root = "."

[prefixes]
cli = "cargo-shallguard"

[areas.CLI]
label = "Command Line"
hard_enforcement = true
hard_verification = true

[areas.SPEC]
label = "Specification"
hard_enforcement = true
hard_verification = true

[areas.TRACE]
label = "Traceability"
hard_enforcement = true
hard_verification = true

[areas.BASE]
label = "Baseline"
hard_enforcement = true
hard_verification = true

[areas.IMP]
label = "Change Impact"
hard_enforcement = true
hard_verification = true

[areas.TEST]
label = "Test Identity"
hard_enforcement = true
hard_verification = true

[areas.COV]
label = "Executable Coverage"
hard_enforcement = true
hard_verification = true

[areas.CAP]
label = "Review Capsule"
hard_enforcement = true
hard_verification = true

[areas.REV]
label = "Semantic Review"
hard_enforcement = true
hard_verification = true

[areas.STATIC]
label = "Static Checking"
hard_enforcement = true
hard_verification = true

[areas.PORT]
label = "Portability"
hard_enforcement = true
hard_verification = true

[areas.SEC]
label = "Safety and Trust"
hard_enforcement = true
hard_verification = true

[artifacts]
root = "target/shallguard"

[review]
target = "origin/master"
provider = "codex"
with_coverage = true
timeout_seconds = 300
