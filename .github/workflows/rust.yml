name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Format
      run: cargo fmt --all -- --check
    - name: Build
      run: cargo build --workspace --all-targets --locked
    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --workspace --locked
    - name: Requirement assurance
      run: |
        cargo shallguard-dev fmt --check
        cargo shallguard-dev check
    - name: Documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps --locked
    - name: Package readiness
      run: |
        cargo package --locked -p shallguard-macros
        cargo package --locked --list -p shallguard > /dev/null
        cargo package --locked --list -p cargo-shallguard > /dev/null

  msrv:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.89.0
      run: rustup toolchain install 1.89.0 --profile minimal
    - name: Check minimum supported Rust version
      run: cargo +1.89.0 check --workspace --all-targets --locked
