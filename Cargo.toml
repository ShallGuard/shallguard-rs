[package]
name = "shallguard"
version = "0.1.0"
authors = ["Tomas Siegl <tomas.siegl@gmail.com>"]
edition = "2024"
publish = false
description = "ShallGuard requirement traceability, executable coverage, and review tooling"
license = "MIT"
repository = "https://github.com/sigi64/shallguard"

[workspace]
members = ["cargo-shallguard", "shallguard-macros"]
resolver = "3"

[lib]
name = "shallguard"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
shallguard-macros = { path = "shallguard-macros", version = "0.1.0" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
regex = "1.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2.0"
toml = "0.9.5"

[dev-dependencies]
tempfile = "3.23.0"
